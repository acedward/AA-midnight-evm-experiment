# midnight-aa — persistent local Midnight 2.x network (PLAN-01 Part 0).
#
# Modelled on /Users/edwardalvarado/compact-end-2-end/infra/docker-compose.yml @ aa344546
# (the proven 2.0.0-rc.4 stack), with every host port templated from infra/STACK.env.
#
# This file has NO port defaults on purpose: running `docker compose` without
# --env-file infra/STACK.env fails with a missing-variable error rather than
# silently binding 9944/8088/6300 — on this machine those are a proxy onto
# somebody else's live stack (PLAN-00 §7, PART-E Q4).
#
# Lifecycle: infra/stack-up.sh (idempotent), stack-status.sh, stack-down.sh.
# This stack is LONG-LIVED. Never `down -v` it from a test suite.

name: ${COMPOSE_PROJECT_NAME:?STACK.env not loaded}

services:
  midnight-node:
    image: ${AA_NODE_IMAGE:?}
    container_name: ${COMPOSE_PROJECT_NAME:?}-node
    ports:
      - "127.0.0.1:${AA_NODE_PORT:?}:9944"
    environment:
      # CFG_PRESET=dev loads the Midnight `undeployed` chainspec which gifts
      # wallet-seed-{0..3} (0x000…001 / 002 / 003 / a51c…) Night+Zswap+Dust at
      # genesis. Plain Substrate --dev does not — pallet_midnight's ledger state
      # ships separately from pallet_balances and is only populated by the dev
      # preset. SIDECHAIN_BLOCK_BENEFICIARY is the seed-0-derived reward target.
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
      RUST_LOG: "info"
    command:
      # --validator + --alice authorizes this node to produce blocks under the
      # `undeployed` chainspec. --force-authoring keeps producing at peer count 0.
      # --unsafe-force-node-key-generation creates the libp2p identity on first boot.
      - --validator
      - --alice
      - --force-authoring
      - --unsafe-force-node-key-generation
      - --rpc-external
      - --rpc-cors=all
      - --rpc-methods=unsafe
      # Archive state pruning (2026-08-11 incident, PLAN-05 §Questions): the
      # default 256-block state pruning made the chain UNRECOVERABLE when the
      # indexer container (whose sqlite had no volume, fixed below) was lost —
      # a fresh indexer must replay from genesis and dies on
      # "State already discarded" the moment block-0 state is pruned. Archive
      # mode keeps every state so an indexer re-create can always re-index.
      - --state-pruning=archive
    volumes:
      # BASE_PATH=/node/chain — persisted so `docker compose restart|up -d` keeps
      # the chain state that every later PLAN's DEPLOYMENTS.json addresses live in.
      - node-chain:/node/chain
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9944/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    networks: [midnight]

  indexer:
    image: ${AA_INDEXER_IMAGE:?}
    container_name: ${COMPOSE_PROJECT_NAME:?}-indexer
    depends_on:
      midnight-node:
        condition: service_healthy
    ports:
      # The indexer serves GraphQL-over-HTTP and GraphQL-over-WS on ONE container
      # port. STACK.env allocates two host ports (P+1 http, P+2 ws) per PLAN-01;
      # both are published onto 8088 so the plan's URL contract holds literally.
      - "127.0.0.1:${AA_INDEXER_HTTP_PORT:?}:8088"
      - "127.0.0.1:${AA_INDEXER_WS_PORT:?}:8088"
    environment:
      # APP__<section>__<key> overrides the bundled /opt/indexer-standalone/config.yaml.
      APP__INFRA__NODE__URL: "ws://midnight-node:9944"
      APP__INFRA__SPO_NODE__URL: "ws://midnight-node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "dummy-not-using-spo"
      # Must parse as a string: an all-numeric value is read as int and rejected.
      APP__INFRA__SECRET: "${AA_INDEXER_SECRET:?}"
      APP__APPLICATION__NETWORK_ID: "${MIDNIGHT_NETWORK_ID:?}"
      RUST_LOG: "info"
    volumes:
      # 2026-08-11 incident (PLAN-05 §Questions): the indexer keeps its whole
      # view in /data (indexer.sqlite + ledger-db.sqlite), and without a volume
      # that lived in the CONTAINER LAYER — losing the container lost the view,
      # and with the node's then-default state pruning the chain could never be
      # re-indexed. Persist it like node-chain.
      - indexer-data:/data
    healthcheck:
      # The image is bash-only (no curl/wget/nc), so this is a bash /dev/tcp
      # listener probe. Real GraphQL readiness is asserted host-side by
      # stack-up.sh / stack-status.sh, which is a strictly stronger check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    networks: [midnight]

  proof-server:
    image: ${AA_PROOF_SERVER_IMAGE:?}
    container_name: ${COMPOSE_PROJECT_NAME:?}-proof-server
    ports:
      - "127.0.0.1:${AA_PROOF_SERVER_PORT:?}:6300"
    environment:
      RUST_LOG: "debug,midnight_proof_server=trace,midnight_zkir_v3=trace"
      MIDNIGHT_PARAM_SOURCE: ${MIDNIGHT_PARAM_SOURCE:-https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/}
      # Named volume: public params are a multi-minute one-time download and MUST
      # survive restarts (PLAN-01 Part 0 — proving is the slowest resource we have).
      MIDNIGHT_PP: /proof-params
    volumes:
      - proof-params:/proof-params
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No container healthcheck: the image is distroless (no shell, no curl), so
    # nothing can run inside it. stack-up.sh probes /health from the host.
    restart: unless-stopped
    networks: [midnight]

networks:
  midnight:
    driver: bridge

volumes:
  proof-params:
  node-chain:
  indexer-data:
